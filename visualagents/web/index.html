<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VisualAgents</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111110'/%3E%3Ccircle cx='9' cy='16' r='4' fill='%233987e5'/%3E%3Ccircle cx='23' cy='9' r='4' fill='%23199e70'/%3E%3Ccircle cx='23' cy='23' r='4' fill='%23d95926'/%3E%3Cpath d='M13 15l6-4M13 17l6 4' stroke='%23f0efec' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="9" cy="16" r="4"/><circle cx="23" cy="9" r="4"/><circle cx="23" cy="23" r="4"/><path d="M13 15l6-4M13 17l6 4"/></svg>
      <span>VisualAgents</span>
    </div>
    <div class="project">
      <select id="project-switch" class="project-switch" aria-label="Project" hidden></select>
      <span id="project-name" class="project-name">…</span>
      <span id="framework" class="badge"></span>
      <span id="attribution" class="badge subtle" title="How agent activity is being attributed"></span>
    </div>
    <div class="spacer"></div>
    <div id="run-status" class="run-status" data-status="connecting">
      <span class="dot" aria-hidden="true"></span><span class="label">Connecting</span><span id="timer" class="timer"></span>
    </div>
    <button id="btn-blueprint" class="btn" title="Workflow blueprint (B)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="8.5" y="14" width="7" height="7" rx="1.5"/><path d="M6.5 10v2h11v-2M12 12v2"/></svg>
      <span>Blueprint</span>
    </button>
    <button id="btn-theme" class="icon-btn" title="Theme" aria-label="Toggle theme"></button>
  </header>

  <nav id="stepper" class="stepper" aria-label="Workflow steps"></nav>

  <main class="layout">
    <section id="canvas-wrap" class="canvas-wrap" aria-label="Agent map">
      <div id="canvas" class="canvas">
        <svg id="edges" class="edges" aria-hidden="true"></svg>
        <div id="nodes" class="nodes"></div>
      </div>
      <div class="canvas-tools">
        <button class="icon-btn" id="zoom-in" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-btn" id="zoom-out" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button class="icon-btn" id="fit" title="Fit to screen (F)" aria-label="Fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="icon-btn" id="relayout" title="Reset block positions" aria-label="Reset block positions"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h4a3 3 0 0 1 3 3v4"/></svg></button>
        <button class="icon-btn toggle" id="follow" title="Follow the active agent" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      </div>
      <div class="legend" aria-label="Legend">
        <span><i class="lg lg-solid"></i>handoff</span>
        <span><i class="lg lg-dash"></i>conditional</span>
        <span><i class="lg lg-dot"></i>observed only at runtime</span>
      </div>
      <div id="empty-hint" class="empty-hint" hidden></div>
      <div id="start-card" class="start-card" hidden></div>
    </section>

    <aside class="side">
      <section id="now" class="now" aria-live="polite"></section>
      <div class="feed-head">
        <h2>Live chain of thought</h2>
        <div class="feed-actions">
          <label class="check"><input type="checkbox" id="hide-logs"> hide plain logs</label>
        </div>
      </div>
      <div id="filters" class="filters" role="toolbar" aria-label="Filter by agent"></div>
      <div id="feed" class="feed" role="log"></div>
      <button id="jump" class="jump" hidden>Jump to latest ↓</button>
    </aside>
  </main>

  <footer class="timeline" aria-label="Run timeline">
    <div class="tl-controls">
      <button id="tl-play" class="icon-btn" aria-label="Play"></button>
      <button id="tl-speed" class="tl-speed" title="Playback speed">4×</button>
      <button id="tl-live" class="tl-live on" title="Back to the live run (L)">Live</button>
    </div>
    <div id="tl-track" class="tl-track" role="slider" tabindex="0" aria-label="Run timeline - drag to rewind" aria-valuemin="0">
      <div id="tl-steps" class="tl-steps"></div>
      <div id="tl-bar" class="tl-bar"></div>
      <div id="tl-fade" class="tl-fade" hidden></div>
      <div id="tl-ticks" class="tl-ticks"></div>
      <div id="tl-hover" class="tl-hover" hidden></div>
      <div id="tl-head" class="tl-head" hidden><div id="tl-tip" class="tl-tip"></div><div class="tl-knob"></div></div>
      <div id="tl-empty" class="tl-empty">The timeline fills in as agents take turns - then drag it to rewind.</div>
    </div>
    <button class="link-btn" id="reset-view" title="Clear agent statuses (e.g. before the next query)">Reset map</button>
  </footer>

  <div id="blueprint-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="bp-title">
      <div class="modal-head">
        <div>
          <div class="eyebrow">Workflow blueprint</div>
          <h2 id="bp-title"></h2>
        </div>
        <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="bp-body" class="modal-body"></div>
      <div class="modal-foot">
        <span class="muted small" id="bp-meta"></span>
        <button class="btn primary" data-close>Watch it live</button>
      </div>
    </div>
  </div>

  <aside id="drawer" class="drawer" hidden aria-label="Agent details">
    <div class="drawer-head">
      <div id="drawer-title"></div>
      <button class="icon-btn" id="drawer-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <script src="/assets/app.js"></script>
</body>
</html>
