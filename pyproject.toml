[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "visualagents"
version = "0.1.0"
description = "A live map of which agent in a multi-agent AI system is doing what - from its chain of thought."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "VisualAgents contributors" }]
keywords = ["agents", "multi-agent", "llm", "langgraph", "crewai", "autogen", "gemini", "claude", "observability", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Monitoring",
]
dependencies = ["anthropic>=1.15"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
google = ["google-genai>=2.0"]
all = ["openai>=1.40", "google-genai>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
visualagents = "visualagents.cli:main"
vagents = "visualagents.cli:main"

[project.urls]
Homepage = "https://github.com/kaih06-hub/VisualAgents"
Documentation = "https://github.com/kaih06-hub/VisualAgents#readme"
Issues = "https://github.com/kaih06-hub/VisualAgents/issues"
Changelog = "https://github.com/kaih06-hub/VisualAgents/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["visualagents"]

[tool.hatch.build.targets.sdist]
include = ["visualagents", "examples", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
